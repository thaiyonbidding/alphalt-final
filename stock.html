<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>สต็อกคงเหลือ | โรงงานยางมะตอย</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="app-shell">
<div class="sidebar" id="sidebar"></div>
<div class="main-scroll">

  <div class="topbar">
    <p class="eyebrow">กันทรลักษ์ไทยนต์ · แพล้นยาง</p>
    <h1>สต็อกคงเหลือ</h1>
  </div>

  <div class="container">
    <div class="stock-grid" id="stockGrid">กำลังโหลด...</div>
    <button class="btn btn-dark" onclick="downloadStockSummary()">แชร์ / ดาวน์โหลดรูปสรุปสต็อก</button>

    <div class="card" style="margin-top:14px;">
      <h2>บันทึกน้ำมันดีเซล (รถสิบล้อ)</h2>
      <p class="hint" style="margin-top:-6px;margin-bottom:10px;">แยกจากยอดผลิต ใช้จดเลขไมล์ตู้จ่ายน้ำมันประจำวัน</p>
      <label>วันที่</label>
      <input type="date" id="diesel_date">
      <label>เลขไมล์ ต้นวัน (ลิตร)</label>
      <input type="text" inputmode="decimal" id="diesel_start">
      <p class="hint">ดึงจากเลขไมล์สิ้นวันของรอบก่อนหน้าอัตโนมัติ แก้ไขได้ถ้าเลขไม่ตรง</p>
      <label>เลขไมล์ สิ้นวัน (ลิตร)</label>
      <input type="text" inputmode="decimal" id="diesel_end" placeholder="เช่น 100500">
      <div class="hint" id="dieselCheckHint" style="margin-top:6px;"></div>
      <button class="btn btn-outline" id="dieselBtn" onclick="submitDiesel()">บันทึกดีเซล</button>
    </div>

    <div class="card" style="margin-top:14px;">
      <h2>ประวัติการผลิตล่าสุด</h2>
      <table>
        <thead><tr><th>วันที่</th><th class="num">ตัน</th><th>หน้างาน</th><th class="actions"></th></tr></thead>
        <tbody id="prodTable"></tbody>
      </table>
    </div>

    <div class="card" style="margin-top:14px;">
      <h2>ประวัติน้ำมันดีเซล</h2>
      <table>
        <thead><tr><th>วันที่</th><th class="num">ลิตร</th><th class="actions"></th></tr></thead>
        <tbody id="dieselTable"></tbody>
      </table>
    </div>
  </div>

</div>
</div>

<nav class="navbar" id="navbar"></nav>

<script src="/shared.js"></script>
<script>
renderNav('stock');

let materials = [];
function findMat(code) { return materials.find((m) => m.code === code); }

async function loadMaterials() {
  materials = await apiFetch('/api/materials');
}

async function renderStock() {
  await loadMaterials();
  const grid = document.getElementById('stockGrid');
  grid.innerHTML = materials.map((m) => {
    const stock = Number(m.current_stock);
    const alert = Number(m.low_stock_alert) || 0;
    const pct = alert > 0 ? Math.max(3, Math.min(100, (stock / (alert * 2)) * 100)) : 100;
    let levelClass = '', alertHtml = '';
    if (alert > 0 && stock <= alert) { levelClass = 'low'; alertHtml = '<div class="stock-alert">สต็อกต่ำ เติมด่วน</div>'; }
    else if (alert > 0 && stock <= alert * 1.5) { levelClass = 'mid'; }
    const displayVal = m.unit === 'ton' ? fmt(stock, 1) : Math.round(stock).toLocaleString();
    return `
      <div class="stock-card ${levelClass}">
        <span class="stock-num">${displayVal}</span><span class="stock-unit">${m.unit === 'ton' ? 'ตัน' : 'ลิตร'}</span>
        <div class="stock-name">${m.name}</div>
        <div class="stock-bar-track"><div class="stock-bar-fill" style="width:${pct}%"></div></div>
        ${alertHtml}
      </div>`;
  }).join('');
}

function downloadStockSummary() {
  const stoneRows = materials.filter((m) => ['stone_dust', 'stone_34', 'stone_38'].includes(m.code))
    .map((m) => [m.name, fmt(m.current_stock, 1) + ' ตัน']);
  const asphaltRows = materials.filter((m) => m.code.startsWith('asphalt_'))
    .map((m) => [m.name, fmt(m.current_stock, 0) + ' ลิตร']);
  const oilRows = materials.filter((m) => ['diesel', 'fuel_oil'].includes(m.code))
    .map((m) => [m.name, fmt(m.current_stock, 0) + ' ลิตร']);
  const sections = [
    { heading: 'วัตถุดิบหิน', rows: stoneRows },
    { heading: 'ยางมะตอย', rows: asphaltRows },
    { heading: 'น้ำมัน', rows: oilRows }
  ];
  const canvas = buildReceiptCanvas('สรุปสต็อกคงเหลือ', null, null, sections, 'สต็อกวัสดุ · ' + todayStr());
  triggerDownload(canvas, 'สรุปสต็อก-' + todayStr() + '.png');
}

// ---------- Diesel ----------
async function loadDieselStart() {
  const data = await apiFetch('/api/diesel/last');
  document.getElementById('diesel_start').value = Number(data.meter).toFixed(2);
}

function updateDieselHint() {
  const start = parseNum(document.getElementById('diesel_start').value);
  const end = parseNum(document.getElementById('diesel_end').value);
  const hint = document.getElementById('dieselCheckHint');
  if (!Number.isFinite(end)) { hint.textContent = ''; return; }
  const used = end - start;
  if (used < 0) {
    hint.textContent = 'เลขสิ้นวันต้องมากกว่าต้นวัน (เลขตู้จ่ายเพิ่มขึ้นเรื่อยๆ)';
    hint.style.color = 'var(--danger)';
  } else {
    hint.textContent = `ใช้ไป ${fmt(used, 1)} ลิตร`;
    hint.style.color = 'var(--good)';
  }
}

async function submitDiesel() {
  const btn = document.getElementById('dieselBtn');
  const date = document.getElementById('diesel_date').value;
  const start = parseNum(document.getElementById('diesel_start').value);
  const end = parseNum(document.getElementById('diesel_end').value);

  if (!date || !Number.isFinite(start) || !Number.isFinite(end) || end < start) {
    showToast('กรอกเลขไมล์ให้ถูกต้อง (สิ้นวันต้องมากกว่าต้นวัน)');
    return;
  }
  btn.disabled = true;
  try {
    await apiFetch('/api/diesel', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ log_date: date, meter_start: start, meter_end: end })
    });
    showToast(`บันทึกดีเซลสำเร็จ ใช้ไป ${fmt(end - start, 1)} ลิตร`);
    document.getElementById('diesel_end').value = '';
    document.getElementById('dieselCheckHint').textContent = '';
    await loadDieselStart();
    await renderStock();
    await renderDieselTable();
  } catch (err) {
    showToast(err.message);
  } finally {
    btn.disabled = false;
  }
}

async function renderDieselTable() {
  const rows = await apiFetch('/api/logs/diesel');
  document.getElementById('dieselTable').innerHTML = rows.map((r) => `
    <tr>
      <td>${new Date(r.log_date).toLocaleDateString('th-TH')}</td>
      <td class="num">${fmt(r.liters_used, 1)}</td>
      <td class="actions"><button class="del-btn" onclick="deleteDieselLog(${r.id})" title="ลบรายการนี้">✕</button></td>
    </tr>
  `).join('') || '<tr><td colspan="3">ยังไม่มีข้อมูล</td></tr>';
}

async function deleteDieselLog(id) {
  if (!confirm('ลบรายการนี้และคืนสต็อกดีเซลหรือไม่?')) return;
  try {
    await apiFetch('/api/diesel/' + id, { method: 'DELETE' });
    showToast('ลบรายการและคืนสต็อกแล้ว');
    await loadDieselStart();
    await renderStock();
    await renderDieselTable();
  } catch (err) {
    showToast(err.message);
  }
}

// ---------- Production history ----------
async function renderProdTable() {
  const rows = await apiFetch('/api/logs/production');
  document.getElementById('prodTable').innerHTML = rows.map((r) => `
    <tr>
      <td>${new Date(r.production_date).toLocaleDateString('th-TH')}</td>
      <td class="num">${fmt(r.tons_produced, 1)}</td>
      <td>${r.job_site || '—'}</td>
      <td class="actions"><button class="del-btn" onclick="deleteProdLog(${r.id})" title="ลบรายการนี้">✕</button></td>
    </tr>
  `).join('') || '<tr><td colspan="4">ยังไม่มีข้อมูล</td></tr>';
}

async function deleteProdLog(id) {
  if (!confirm('ลบรายการนี้และคืนสต็อกที่ตัดไปหรือไม่?')) return;
  try {
    await apiFetch('/api/production/' + id, { method: 'DELETE' });
    showToast('ลบรายการและคืนสต็อกแล้ว');
    await renderStock();
    await renderProdTable();
    await loadDieselStart();
  } catch (err) {
    showToast(err.message);
  }
}

document.getElementById('diesel_end').addEventListener('input', updateDieselHint);
document.getElementById('diesel_start').addEventListener('input', updateDieselHint);
document.getElementById('diesel_date').value = todayStr();

(async function init() {
  await renderStock();
  await renderProdTable();
  await loadDieselStart();
  await renderDieselTable();
})();
</script>

</body>
</html>
